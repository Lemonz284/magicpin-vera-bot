version: '3.8'

services:
  vera-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vera-bot-service
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - TEAM_NAME=Vera Bot
      - CONTACT_EMAIL=builder@example.com
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/v1/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
